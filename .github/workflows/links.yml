name: external links

# Weekly, not on every PR: external sites go down or rate-limit, and that
# should never block a contribution. Relative links are checked in checks.yml.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,429 --max-retries 3 './**/*.md'
          fail: true
