name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_skill.py

  install:
    # Install, update, hand-edit protection and legacy copies, on every OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # install.py recognises older committed versions
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test_install.py

  fixture:
    # The demo shop must build identically on every OS (same HEAD hash).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Build fixture and compare HEAD
        shell: bash
        run: |
          python examples/make_demo_shop.py "$RUNNER_TEMP/demo-shop" | tee build.log
          grep -q "self-test: 1 passed" build.log
          head="$(git -C "$RUNNER_TEMP/demo-shop" rev-parse --short HEAD)"
          echo "HEAD=$head (expected b7fc963)"
          test "$head" = "b7fc963"
